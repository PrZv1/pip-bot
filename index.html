<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIP AI Assistant</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #header { background: #1f1f1f; padding: 15px 20px; border-bottom: 1px solid #333; }
    #header h2 { margin: 0; font-size: 18px; color: #4ba3e3; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; font-size: 15px; line-height: 1.4; }
    .user { align-self: flex-end; background: #007acc; color: #fff; }
    .bot { align-self: flex-start; background: #252526; color: #ddd; border: 1px solid #3c3c3c; }
    #input-area { padding: 15px; background: #1f1f1f; border-top: 1px solid #333; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3c3c3c; background: #2d2d2d; color: #fff; font-size: 15px; }
    button { padding: 12px 24px; background: #007acc; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #005999; }
  </style>
</head>
<body>

  <div id="header">
    <h2>Performance Improvement Plan (PIP) Assistant</h2>
  </div>

  <div id="chat-box">
    <div class="msg bot">Hello! I can help you look up PIP guidelines or generate customized PIP draft plans for your team. What would you like to do?</div>
  </div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="e.g. Draft a 30-day PIP for Alex who has attendance issues..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    async function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      try {
        const response = await fetch('http://127.0.0.1:8000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        addMessage(data.reply, 'bot');
      } catch (err) {
        addMessage("Error: Make sure your Python app.py server is running!", 'bot');
      }
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
