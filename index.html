<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <meta charset="UTF-8">
  <title>PIP AI Assistant</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #header { background: #1f1f1f; padding: 15px 20px; border-bottom: 1px solid #333; }
    #header h2 { margin: 0; font-size: 18px; color: #4ba3e3; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; font-size: 15px; line-height: 1.4; }
    .user { align-self: flex-end; background: #007acc; color: #fff; }
    .bot { align-self: flex-start; background: #252526; color: #ddd; border: 1px solid #3c3c3c; }
    #input-area { padding: 15px; background: #1f1f1f; border-top: 1px solid #333; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3c3c3c; background: #2d2d2d; color: #fff; font-size: 15px; }
    button { padding: 12px 24px; background: #007acc; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #005999; }
  </style>
</head>
<body>

  <div id="header">
    <h2>Performance Improvement Plan (PIP) Assistant</h2>
  </div>

  <div id="chat-box">
    <div class="msg bot">Hello! I can help you look up PIP guidelines or generate customized PIP draft plans for your team. What would you like to do?</div>
  </div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="e.g. Draft a 30-day PIP for Alex who has attendance issues..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
  let chatHistory = [];

  // Enable "Enter" key to send
  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });

  // Function for quick prompt buttons
  function sendQuickPrompt(text) {
    document.getElementById('userInput').value = text;
    sendMsg();
  }

  async function sendMsg() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    // 1. Add User Message
    addMessage(text, 'user');
    input.value = '';

    // 2. Add to history memory
    chatHistory.push({ role: "user", content: text });

    // 3. Show Loading State
    const loadingId = addMessage("PIP Bot is thinking...", 'bot', true);

    try {
      const response = await fetch('https://pip-bot-backend.onrender.com/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          message: text,
          history: chatHistory  // Sending full history to backend!
        })
      });

      const data = await response.json();
      removeMessage(loadingId);

      // 4. Render Bot Response as Markdown
      addMessage(data.reply, 'bot');
      chatHistory.push({ role: "assistant", content: data.reply });

    } catch (err) {
      removeMessage(loadingId);
      addMessage("Error: Could not reach the server.", 'bot');
    }
  }

  function addMessage(text, sender, isLoading = false) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    const id = 'msg-' + Date.now();
    
    div.id = id;
    div.className = `message ${sender}-message ${isLoading ? 'loading' : ''}`;
    
    // Parse Markdown for bot, keep raw text for user
    if (sender === 'bot' && !isLoading) {
      div.innerHTML = marked.parse(text);
    } else {
      div.innerText = text;
    }
    
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return id;
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>

</body>
</html>
